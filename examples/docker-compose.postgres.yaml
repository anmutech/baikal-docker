# Docker Compose file for a Baikal server with PostgreSQL 18
# Adapted from examples/docker-compose.mariadb.yaml

services:
  baikal:
    image: anmutech/baikal:nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - config:/var/www/baikal/config
      - data:/var/www/baikal/Specific
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(str_contains(file_get_contents('http://127.0.0.1:80/') ?? '', 'Baïkal is running alright.') ? 0 : 1);\""]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    # set shared memory limit
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ilovecookies
      POSTGRES_DB: baikal
      POSTGRES_USER: baikal
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]

volumes:
  config:
  data:
  db:
