services:
  baikal:
    image: anmutech/baikal:apache
    restart: always
    environment:
      BAIKAL_SERVERNAME: dav.example.io
      BAIKAL_SERVERALIAS: dav.example.org dav.example.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - config:/var/www/baikal/config
      - data:/var/www/baikal/Specific
      # - /etc/ssl/private/baikal:/etc/ssl/private
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(str_contains(file_get_contents('http://127.0.0.1:80/') ?? '', 'Baïkal is running alright.') ? 0 : 1);\""]

volumes:
  config:
  data:
