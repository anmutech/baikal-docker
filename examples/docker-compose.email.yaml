# Docker Compose file for a Baikal server
# See https://github.com/anmutech/baikal-docker/blob/main/docs/email-guide.md

services:
  baikal:
    image: anmutech/baikal:nginx
    restart: always
    environment:
      MSMTPRC: |
        defaults
        auth           on
        tls            on
        tls_trust_file /etc/ssl/certs/ca-certificates.crt
        account        default
        host           <smtp host>
        port           587
        from           baikal@example.com
        user           <user>
        password       <password>
    ports:
      - "80:80"
    volumes:
      - config:/var/www/baikal/config
      - data:/var/www/baikal/Specific
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r "exit(str_contains(file_get_contents(''http://127.0.0.1:80/'') ?? '''', ''Baïkal is running alright.'') ? 0 : 1);"',
        ]

volumes:
  config:
  data:
