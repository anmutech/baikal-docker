# Docker Compose file for a Baikal server

services:
  baikal:
    image: anmutech/baikal:nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - config:/var/www/baikal/config
      - data:/var/www/baikal/Specific
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r "exit(str_contains(file_get_contents(''http://127.0.0.1:80/'') ?? '''', ''Baïkal is running alright.'') ? 0 : 1);"',
        ]

volumes:
  config:
  data:
