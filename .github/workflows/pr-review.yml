name: PR review

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Cypress dependencies
        run: npm ci

      - name: Ensure files follow code style
        run: npm run prettier:check

      - name: Ensure files pass eslint checks
        run: npm run lint

  read_versions:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      baikal: ${{ steps.read-versions.outputs.BAIKAL }}
      latest-php: ${{ steps.read-versions.outputs.LATEST_PHP }}
      oldest-php: ${{ steps.read-versions.outputs.OLDEST_PHP }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Read versions and validate versions.env
        id: read-versions
        uses: ./.github/actions/read-versions

  test:
    name: Test ${{ matrix.server }} (php-${{ matrix.php-version }})
    needs:
      - lint
      - read_versions
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.server }}
      php-version: ${{ matrix.php-version }}
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
      ref: ${{ github.event.pull_request.head.sha }}
      port: ${{ matrix.server == 'nginx-unprivileged' && 8080 || 80 }}
    strategy:
      fail-fast: true
      matrix:
        server:
          - apache
          - nginx
          - nginx-unprivileged
        php-version:
          - ${{ needs.read_versions.outputs.latest-php }}
          - ${{ needs.read_versions.outputs.oldest-php }}
