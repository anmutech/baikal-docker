name: Test job

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Server to test (apache, nginx, or nginx-unprivileged); the .dockerfile suffix is appended automatically
        required: true
        type: string
      php-version:
        description: PHP version build arg; source it from versions.env
        required: true
        type: string
      baikal-version:
        description: Baikal version build arg; must match the version the caller will build/publish
        required: true
        type: string
      port:
        description: >-
          Container port the image listens on (80 for apache/nginx, 8080 for
          nginx-unprivileged); it is always exposed as host port 80
        default: "80"
        type: string
      ref:
        description: Git reference to test
        default: ${{ github.ref }}
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Cypress dependencies
        run: npm ci

      - name: Build Docker image
        id: build
        run: |
          docker build -f ${{ inputs.dockerfile }}.dockerfile \
          --build-arg BAIKAL_VERSION="${{ inputs.baikal-version }}" \
          --build-arg PHP_VERSION="${{ inputs.php-version }}" \
          -t baikal-image .

      - name: Start Baikal container
        # No --rm: read the logs if the container exits during the tests.
        run: docker run -dp 80:${{ inputs.port }} --name baikal-test baikal-image

      - name: Run Cypress tests
        run: npm run test

      - name: Dump container logs on failure
        if: always()
        run: |
          docker stop baikal-test >/dev/null 2>&1 || true
          docker logs baikal-test

      - name: Assert Home Assistant fix is not applied by default
        run: |
          if docker exec baikal-test grep -q "Home Assistant Fix" /var/www/baikal/vendor/sabre/dav/lib/CalDAV/Plugin.php; then
            echo "::error file=files/docker-entrypoint.d/30-apply-home-assistant-fix.sh:: Home Assistant fix was applied, even though it was not enabled."
            exit 1
          fi

      - name: Stop Baikal container
        run: docker stop baikal-test

      - name: Assert Home Assistant fix is applied
        run: |
          # Start Baikal with Home Assistant fix enabled
          docker run --rm -d --name baikal-ha -e APPLY_HOME_ASSISTANT_FIX=true baikal-image
          sleep 3s
          docker logs baikal-ha

          # Assert Home Assistant fix is applied
          if ! docker exec baikal-ha grep -q "Home Assistant Fix" /var/www/baikal/vendor/sabre/dav/lib/CalDAV/Plugin.php; then
            echo "::error file=files/docker-entrypoint.d/30-apply-home-assistant-fix.sh:: Home Assistant fix was not applied, even though it was enabled."
            exit 1
          fi

          # Stop Baikal
          docker stop baikal-ha

      - name: Build and run local mail server
        working-directory: cypress/fixtures
        run: |
          docker build -t mail-server -f mail-server.dockerfile .
          docker run --rm -d --name mail-server -p 8025:8025 -p 8080:8080 mail-server

      - name: Start Baikal container with MSMTP configuration
        env:
          MSMTPRC: |
            account default
            host    mail-server
            port    8025
            from    baikal@example.com
        run: |
          docker run --rm --detach -p 80:${{ inputs.port }} -e MSMTPRC="$MSMTPRC" --link mail-server --name baikal baikal-image
          docker cp ${{ github.workspace }}/cypress/fixtures/mail-test.php baikal:/var/www/baikal/html/

      - name: Run Cypress tests incl. MSMTP
        run: CYPRESS_MSMTP_ENABLED=TRUE npm run test

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-${{ inputs.dockerfile }}-${{ inputs.php-version }}
          path: cypress/screenshots
