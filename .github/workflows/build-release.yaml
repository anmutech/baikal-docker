# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Build release images

on:
  release:
    types:
      - published

concurrency:
  group: build-release-images
  cancel-in-progress: true

jobs:
  parse_release_tag:
    runs-on: ubuntu-latest
    outputs:
      baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}
      latest-php: ${{ steps.read-versions.outputs.LATEST_PHP }}
      oldest-php: ${{ steps.read-versions.outputs.OLDEST_PHP }}
    steps:
      # Get the release version by stripping build metadata from the release name
      - name: Parse release tag
        id: parse-release-tag
        run: echo BAIKAL_VERSION=${GITHUB_REF_NAME/+*/} >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Read versions and validate versions.env
        id: read-versions
        uses: ./.github/actions/read-versions
        with:
          # This workflow publishes the release-tagged Baïkal, so the release
          # tag is the version of record; versions.env only provides the PHP versions.
          baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}

  apache:
    name: Apache
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      php-version: ${{ needs.parse_release_tag.outputs.latest-php }}
      tags: |
        anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-apache
        anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}
    secrets: inherit

  apache_oldest_php:
    name: Apache (PHP ${{ needs.parse_release_tag.outputs.oldest-php }})
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      php-version: ${{ needs.parse_release_tag.outputs.oldest-php }}
      tags: |
        anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-apache-php${{ needs.parse_release_tag.outputs.oldest-php }}
        anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-php${{ needs.parse_release_tag.outputs.oldest-php }}
    secrets: inherit

  nginx:
    name: Nginx
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      php-version: ${{ needs.parse_release_tag.outputs.latest-php }}
      tags: anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-nginx
    secrets: inherit

  nginx_oldest_php:
    name: Nginx (PHP ${{ needs.parse_release_tag.outputs.oldest-php }})
    needs: parse_release_tag
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      php-version: ${{ needs.parse_release_tag.outputs.oldest-php }}
      tags: anmutech/baikal:${{ needs.parse_release_tag.outputs.baikal-version }}-nginx-php${{ needs.parse_release_tag.outputs.oldest-php }}
    secrets: inherit
