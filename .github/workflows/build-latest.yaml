# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Latest images

on:
  # Rebuild every week on Sunday at 8:20 UTC
  schedule:
    - cron: 20 8 * * 0

  # Build when a release is published
  release:
    types:
      - published

  # Allow manually triggered rebuilds
  workflow_dispatch:

jobs:
  parse_release_tag:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.parse-release-tag.outputs.REF_NAME }}
      baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}
      latest-php: ${{ steps.read-versions.outputs.LATEST_PHP }}
      oldest-php: ${{ steps.read-versions.outputs.OLDEST_PHP }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Parse release tag
        id: parse-release-tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]
          then
            # Get the release version by stripping build metadata from the release name
            echo Parsing tag from release ref $REF_NAME
            REF_NAME=$GITHUB_REF_NAME
          else
            # Get the latest release version from the GitHub API
            echo Parsing tag from latest release ref $REF_NAME
            REF_NAME=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          fi

          BAIKAL_VERSION=${REF_NAME/+*/}
          echo Parsed Baikal version $BAIKAL_VERSION from release $REF_NAME
          echo REF_NAME=$REF_NAME >> "$GITHUB_OUTPUT"
          echo BAIKAL_VERSION=$BAIKAL_VERSION >> "$GITHUB_OUTPUT"

      - name: Read versions and validate versions.env
        id: read-versions
        uses: ./.github/actions/read-versions
        with:
          # This workflow publishes the release-tagged Baïkal, so the release
          # tag is the version of record; versions.env only provides the PHP versions.
          baikal-version: ${{ steps.parse-release-tag.outputs.BAIKAL_VERSION }}

  test:
    name: Test ${{ matrix.server }} (php-${{ matrix.php-version }})
    needs: parse_release_tag
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.server }}
      php-version: ${{ matrix.php-version }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      port: ${{ matrix.server == 'nginx-unprivileged' && 8080 || 80 }}
    strategy:
      fail-fast: true
      matrix:
        server:
          - apache
          - nginx
          - nginx-unprivileged
        php-version:
          - ${{ needs.parse_release_tag.outputs.latest-php }}
          - ${{ needs.parse_release_tag.outputs.oldest-php }}

  apache:
    name: Apache
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: apache.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      php-version: ${{ needs.parse_release_tag.outputs.latest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      tags: |
        anmutech/baikal:apache
        anmutech/baikal:latest
    secrets: inherit

  apache_oldest_php:
    name: Apache (PHP ${{ needs.parse_release_tag.outputs.oldest-php }})
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: apache.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      php-version: ${{ needs.parse_release_tag.outputs.oldest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      tags: anmutech/baikal:apache-php${{ needs.parse_release_tag.outputs.oldest-php }}
    secrets: inherit

  nginx:
    name: Nginx
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      php-version: ${{ needs.parse_release_tag.outputs.latest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      tags: anmutech/baikal:nginx
    secrets: inherit

  nginx_oldest_php:
    name: Nginx (PHP ${{ needs.parse_release_tag.outputs.oldest-php }})
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      php-version: ${{ needs.parse_release_tag.outputs.oldest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      tags: anmutech/baikal:nginx-php${{ needs.parse_release_tag.outputs.oldest-php }}
    secrets: inherit

  nginx_unprivileged:
    name: Nginx unprivileged
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx-unprivileged.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      php-version: ${{ needs.parse_release_tag.outputs.latest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      tags: anmutech/baikal:nginx-unprivileged
    secrets: inherit

  nginx_unprivileged_oldest_php:
    name: Nginx unprivileged (PHP ${{ needs.parse_release_tag.outputs.oldest-php }})
    needs:
      - parse_release_tag
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      ref: ${{ needs.parse_release_tag.outputs.ref }}
      dockerfile: nginx-unprivileged.dockerfile
      image-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      image-revision: ${{ needs.parse_release_tag.outputs.ref }}
      php-version: ${{ needs.parse_release_tag.outputs.oldest-php }}
      baikal-version: ${{ needs.parse_release_tag.outputs.baikal-version }}
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      tags: anmutech/baikal:nginx-unprivileged-php${{ needs.parse_release_tag.outputs.oldest-php }}
    secrets: inherit
