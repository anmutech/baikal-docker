# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Experimental images

on:
  # Rebuild every quarter on Sunday at 8:20 UTC
  schedule:
    - cron: 20 8 * 1/3 0

  # Build on push to master
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-experimental.yaml
      - "*.dockerfile"
      - files/**
      - versions.env

  # Allow manually triggered rebuilds
  workflow_dispatch:

concurrency:
  group: build-experimental-images
  cancel-in-progress: true

# Run the automated tests first, then publish the images if the tests pass
jobs:
  read_versions:
    runs-on: ubuntu-latest
    outputs:
      baikal: ${{ steps.read-versions.outputs.BAIKAL }}
      latest-php: ${{ steps.read-versions.outputs.LATEST_PHP }}
      oldest-php: ${{ steps.read-versions.outputs.OLDEST_PHP }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Read versions and validate versions.env
        id: read-versions
        uses: ./.github/actions/read-versions

  test:
    name: Test ${{ matrix.server }} (php-${{ matrix.php-version }})
    needs: read_versions
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.server }}
      php-version: ${{ matrix.php-version }}
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
    strategy:
      fail-fast: true
      matrix:
        server:
          - apache
          - nginx
        php-version:
          - ${{ needs.read_versions.outputs.latest-php }}
          - ${{ needs.read_versions.outputs.oldest-php }}

  apache:
    name: Apache
    needs:
      - read_versions
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache.dockerfile
      image-version: experimental
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
      php-version: ${{ needs.read_versions.outputs.latest-php }}
      tags: |
        anmutech/baikal:experimental-apache
        anmutech/baikal:experimental
    secrets: inherit

  apache_oldest_php:
    name: Apache (oldest PHP ${{ needs.read_versions.outputs.oldest-php }})
    needs:
      - read_versions
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache.dockerfile
      image-version: experimental
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
      php-version: ${{ needs.read_versions.outputs.oldest-php }}
      tags: |
        anmutech/baikal:experimental-apache-php${{ needs.read_versions.outputs.oldest-php }}
        anmutech/baikal:experimental-php${{ needs.read_versions.outputs.oldest-php }}
    secrets: inherit

  nginx:
    name: Nginx
    needs:
      - read_versions
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      image-version: experimental
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
      php-version: ${{ needs.read_versions.outputs.latest-php }}
      tags: anmutech/baikal:experimental-nginx
    secrets: inherit

  nginx_oldest_php:
    name: Nginx (oldest PHP ${{ needs.read_versions.outputs.oldest-php }})
    needs:
      - read_versions
      - test
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      image-version: experimental
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      baikal-version: ${{ needs.read_versions.outputs.baikal }}
      php-version: ${{ needs.read_versions.outputs.oldest-php }}
      tags: anmutech/baikal:experimental-nginx-php${{ needs.read_versions.outputs.oldest-php }}
    secrets: inherit
